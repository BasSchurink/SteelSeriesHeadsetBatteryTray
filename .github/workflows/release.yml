name: Build Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish standalone Windows executable
        run: >-
          dotnet publish .\src\SteelSeriesHeadsetBatteryTray.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o .\publish

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SteelSeriesHeadsetBatteryTray-win-x64
          path: publish/SteelSeriesHeadsetBatteryTray.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: publish/SteelSeriesHeadsetBatteryTray.exe
